<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
<defs><filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/></filter></defs>
<rect width="1280" height="720" fill="#F8FAFC" data-svgc-id="bg" data-svgc-type="text-decoration"/>
<text x="640" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#1E293B" data-svgc-id="title">关键算法 — 路径规范化 · 导航 · INFO去重 · FIND递归</text>
<line x1="490" y1="54" x2="790" y2="54" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="80" width="590" height="260" rx="10" fill="white" stroke="#2563EB" stroke-width="2" filter="url(#sh)"/>
<rect x="40" y="80" width="590" height="38" rx="10" fill="#2563EB"/>
<rect x="40" y="108" width="590" height="10" fill="#2563EB"/>
<text x="335" y="106" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="white">路径规范化 (normalize)</text>
<circle cx="56" cy="143" r="3" fill="#2563EB" opacity="0.7"/>
<text x="68" y="148" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">输入: /a//b/./c/../d/</text>
<circle cx="56" cy="175" r="3" fill="#2563EB" opacity="0.7"/>
<text x="68" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">去掉首字符 → 按 / 分割 → 逐段处理</text>
<circle cx="56" cy="207" r="3" fill="#2563EB" opacity="0.7"/>
<text x="68" y="212" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">''(空段) → 跳过 | '.' → 跳过 | '..' → 弹出 | 普通 → 入栈</text>
<circle cx="56" cy="239" r="3" fill="#2563EB" opacity="0.7"/>
<text x="68" y="244" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">输出: [a, b, d] → 对应路径 /a/b/d</text>
<circle cx="56" cy="271" r="3" fill="#2563EB" opacity="0.7"/>
<text x="68" y="276" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">边界: 根目录.. → 栈空不操作 | 仅/ → 返回空List</text>
<rect x="660" y="80" width="590" height="260" rx="10" fill="white" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
<rect x="660" y="80" width="590" height="38" rx="10" fill="#059669"/>
<rect x="660" y="108" width="590" height="10" fill="#059669"/>
<text x="955" y="106" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="white">导航机制 (navigate)</text>
<circle cx="676" cy="143" r="3" fill="#059669" opacity="0.7"/>
<text x="688" y="148" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">中间段: 解析链接 (resolve) → 必须是目录</text>
<circle cx="676" cy="175" r="3" fill="#059669" opacity="0.7"/>
<text x="688" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">末段: 保留原始节点 (不解析链接)</text>
<circle cx="676" cy="207" r="3" fill="#059669" opacity="0.7"/>
<text x="688" y="212" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">原因: LS/RM/LINK 需要区分链接和实际节点</text>
<circle cx="676" cy="239" r="3" fill="#059669" opacity="0.7"/>
<text x="688" y="244" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">navigateToParent: 遍历到倒数第二段 → 返回父目录</text>
<rect x="40" y="370" width="590" height="260" rx="10" fill="white" stroke="#7C3AED" stroke-width="2" filter="url(#sh)"/>
<rect x="40" y="370" width="590" height="38" rx="10" fill="#7C3AED"/>
<rect x="40" y="398" width="590" height="10" fill="#7C3AED"/>
<text x="335" y="396" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="white">INFO 去重算法</text>
<circle cx="56" cy="433" r="3" fill="#7C3AED" opacity="0.7"/>
<text x="68" y="438" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">visited = HashSet&lt;Node&gt; (递归链共享)</text>
<circle cx="56" cy="465" r="3" fill="#7C3AED" opacity="0.7"/>
<text x="68" y="470" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">DirNode.getSize() → computeSize(visited)</text>
<circle cx="56" cy="497" r="3" fill="#7C3AED" opacity="0.7"/>
<text x="68" y="502" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">每个子节点: 先查visited → 已访问贡献0</text>
<circle cx="56" cy="529" r="3" fill="#7C3AED" opacity="0.7"/>
<text x="68" y="534" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">防止: 链接自引用 → visited去重 → 不重复计数</text>
<rect x="660" y="370" width="590" height="260" rx="10" fill="white" stroke="#F59E0B" stroke-width="2" filter="url(#sh)"/>
<rect x="660" y="370" width="590" height="38" rx="10" fill="#F59E0B"/>
<rect x="660" y="398" width="590" height="10" fill="#F59E0B"/>
<text x="955" y="396" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="white">FIND 递归搜索</text>
<circle cx="676" cy="433" r="3" fill="#F59E0B" opacity="0.7"/>
<text x="688" y="438" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">navigate到起始节点 → findNode检查name匹配</text>
<circle cx="676" cy="465" r="3" fill="#F59E0B" opacity="0.7"/>
<text x="688" y="470" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">resolve → 若是目录 → findDir展开</text>
<circle cx="676" cy="497" r="3" fill="#F59E0B" opacity="0.7"/>
<text x="688" y="502" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">expanded集合: 同一底层目录仅展开一次</text>
<circle cx="676" cy="529" r="3" fill="#F59E0B" opacity="0.7"/>
<text x="688" y="534" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#334155">链接子节点延后处理 → 结果Collections.sort()</text>
<text x="1250" y="704" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#94A3B8">svg-create</text>
</svg>