<text x="340" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1E293B">validate-svg.js</text>
<text x="340" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1E293B">10 项程序化检查</text>
