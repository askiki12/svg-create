<text x="265" y="329" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#166534">0 CRITICAL + 0 HIGH</text>
<rect x="360" y="295" width="170" height="44" rx="6" fill="#FEF3C7" stroke="#92400E" stroke-width="1" opacity="0.6"/>
<text x="445" y="313" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#92400E">WARNED</text>
<text x="445" y="329" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#92400E">3轮后有余留</text>
<rect x="540" y="295" width="170" height="44" rx="6" fill="#FEE2E2" stroke="#991B1B" stroke-width="1" opacity="0.6"/>
<text x="625" y="313" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#991B1B">REJECTED</text>
<text x="625" y="329" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#991B1B">CRITICAL持续</text>
</svg>