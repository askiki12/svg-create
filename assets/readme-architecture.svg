<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="100%" height="100%">
  <defs>
    <!-- Arrowhead marker for flow arrows -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/>
    </marker>
    <!-- Arrowhead marker for fix loop (blue) -->
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <!-- Drop shadow for cards -->
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <!-- Heavy drop shadow for primary agent boxes -->
    <filter id="shadow-heavy" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1100" fill="#FFFFFF"/>

  <!-- ==================== TITLE ==================== -->
  <text
    data-svgc-id="title"
    x="450" y="40"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24" font-weight="bold" fill="#1E293B"
  >SVG Create — System Architecture</text>

  <!-- ==================== 1. USER INPUT ==================== -->
  <g data-svgc-id="user-input">
    <rect x="250" y="75" width="400" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
    <text x="450" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1E40AF">用户输入</text>
    <text x="450" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3B82F6">文章 / 大纲 / Mermaid / JSON / 自然语言 / 修改请求</text>
  </g>

  <!-- Arrow: User Input → Requirements Agent -->
  <line x1="450" y1="135" x2="450" y2="165" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ==================== 2. REQUIREMENTS AGENT (Step 0) ==================== -->
  <g data-svgc-id="requirements-agent">
    <rect x="200" y="170" width="500" height="65" rx="8" fill="#2563EB" filter="url(#shadow-heavy)"/>
    <text x="450" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Step 0: Requirements Agent</text>
    <text x="450" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#DBEAFE">6 modes: Document / Topic / Outline / Single / Modification / Clarification</text>
  </g>

  <!-- Arrow: Requirements Agent → Classifier Agent -->
  <line x1="450" y1="235" x2="450" y2="270" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ==================== 3. CLASSIFIER AGENT (Step 1) ==================== -->
  <g data-svgc-id="classifier-agent">
    <rect x="150" y="275" width="600" height="70" rx="8" fill="#7C3AED" filter="url(#shadow-heavy)"/>
    <text x="450" y="306" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Step 1: Classifier — Type A-G x Complexity L0-L5</text>
    <text x="450" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#DDD6FE">Input analysis → Classification → Pipeline routing</text>
  </g>

  <!-- ==================== BRANCH ARROWS: Classifier → 4 Pipelines ==================== -->
  <g data-svgc-id="branch-arrows">
    <!-- Stem from classifier bottom -->
    <line x1="450" y1="345" x2="450" y2="370" stroke="#94A3B8" stroke-width="2"/>
    <!-- Horizontal distribution bar -->
    <line x1="112" y1="370" x2="787" y2="370" stroke="#94A3B8" stroke-width="2"/>
    <!-- Vertical drops into each pipeline card -->
    <line x1="112" y1="370" x2="112" y2="393" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="337" y1="370" x2="337" y2="393" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="562" y1="370" x2="562" y2="393" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="787" y1="370" x2="787" y2="393" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Section label: Steps 2-4 -->
  <text data-svgc-id="pipelines-label" x="450" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#64748B">STEPS 2-4: PIPELINES</text>

  <!-- ==================== 4. FOUR PIPELINES (Step 2-4) ==================== -->

  <!-- ==== Graph Pipeline (green) ==== -->
  <g data-svgc-id="graph-pipeline">
    <!-- Card body -->
    <rect x="12" y="400" width="200" height="240" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <!-- Card header (top-rounded rect) -->
    <path d="M 12 408 Q 12 400 20 400 L 204 400 Q 212 400 212 408 L 212 440 L 12 440 Z" fill="#059669"/>
    <text x="112" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">📊 Graph Pipeline</text>
    <!-- Subtitle -->
    <text x="112" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280">结构图 / 流程 / 关系</text>
    <!-- Parser stage -->
    <rect x="30" y="478" width="164" height="32" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
    <text x="112" y="499" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#059669">Parser</text>
    <line x1="112" y1="510" x2="112" y2="523" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <!-- Layout stage -->
    <rect x="30" y="526" width="164" height="32" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
    <text x="112" y="547" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#059669">Layout</text>
    <line x1="112" y1="558" x2="112" y2="571" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <!-- Renderer stage -->
    <rect x="30" y="574" width="164" height="32" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
    <text x="112" y="595" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#059669">Renderer</text>
  </g>

  <!-- ==== Chart Pipeline (amber) ==== -->
  <g data-svgc-id="chart-pipeline">
    <rect x="237" y="400" width="200" height="240" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <path d="M 237 408 Q 237 400 245 400 L 429 400 Q 437 400 437 408 L 437 440 L 237 440 Z" fill="#F59E0B"/>
    <text x="337" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">📈 Chart Pipeline</text>
    <text x="337" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280">柱 / 线 / 饼 / 雷达</text>
    <rect x="255" y="478" width="164" height="32" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
    <text x="337" y="499" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#D97706">Parser</text>
    <line x1="337" y1="510" x2="337" y2="523" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <rect x="255" y="526" width="164" height="32" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
    <text x="337" y="547" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#D97706">Layout</text>
    <line x1="337" y1="558" x2="337" y2="571" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <rect x="255" y="574" width="164" height="32" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
    <text x="337" y="595" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#D97706">Renderer</text>
  </g>

  <!-- ==== Text Pipeline (blue) ==== -->
  <g data-svgc-id="text-pipeline">
    <rect x="462" y="400" width="200" height="240" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
    <path d="M 462 408 Q 462 400 470 400 L 654 400 Q 662 400 662 408 L 662 440 L 462 440 Z" fill="#2563EB"/>
    <text x="562" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">📝 Text Pipeline</text>
    <text x="562" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280">列表 / 标题 / 引用</text>
    <rect x="480" y="478" width="164" height="32" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="562" y="499" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2563EB">Parser</text>
    <line x1="562" y1="510" x2="562" y2="523" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <rect x="480" y="526" width="164" height="32" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="562" y="547" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2563EB">Layout</text>
    <line x1="562" y1="558" x2="562" y2="571" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <rect x="480" y="574" width="164" height="32" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="562" y="595" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2563EB">Renderer</text>
  </g>

  <!-- ==== Timeline Pipeline (red) ==== -->
  <g data-svgc-id="timeline-pipeline">
    <rect x="687" y="400" width="200" height="240" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
    <path d="M 687 408 Q 687 400 695 400 L 879 400 Q 887 400 887 408 L 887 440 L 687 440 Z" fill="#EF4444"/>
    <text x="787" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">📅 Timeline Pipeline</text>
    <text x="787" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280">时间线 / 甘特图</text>
    <rect x="705" y="478" width="164" height="32" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
    <text x="787" y="499" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#DC2626">Parser</text>
    <line x1="787" y1="510" x2="787" y2="523" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <rect x="705" y="526" width="164" height="32" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
    <text x="787" y="547" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#DC2626">Layout</text>
    <line x1="787" y1="558" x2="787" y2="571" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <rect x="705" y="574" width="164" height="32" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
    <text x="787" y="595" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#DC2626">Renderer</text>
  </g>

  <!-- ==================== MERGE ARROWS: Pipelines → Reviewer ==================== -->
  <g data-svgc-id="merge-arrows">
    <!-- Vertical drops from each pipeline -->
    <line x1="112" y1="640" x2="112" y2="662" stroke="#94A3B8" stroke-width="2"/>
    <line x1="337" y1="640" x2="337" y2="662" stroke="#94A3B8" stroke-width="2"/>
    <line x1="562" y1="640" x2="562" y2="662" stroke="#94A3B8" stroke-width="2"/>
    <line x1="787" y1="640" x2="787" y2="662" stroke="#94A3B8" stroke-width="2"/>
    <!-- Horizontal merge bar -->
    <line x1="112" y1="662" x2="787" y2="662" stroke="#94A3B8" stroke-width="2"/>
    <!-- Single stem down -->
    <line x1="450" y1="662" x2="450" y2="678" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ==================== 5. REVIEWER + FIX AGENT (Step 5) ==================== -->

  <!-- Reviewer box (left) -->
  <g data-svgc-id="reviewer">
    <rect x="55" y="685" width="360" height="110" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
    <text x="235" y="713" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E293B">🔍 Step 5: Reviewer</text>
    <text x="235" y="740" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">validate-svg.js</text>
    <text x="235" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">6 programmatic checks</text>
  </g>

  <!-- Fix Agent box (right) -->
  <g data-svgc-id="fix-agent">
    <rect x="485" y="685" width="360" height="110" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
    <text x="665" y="713" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E293B">🔧 Fix Agent</text>
    <text x="665" y="740" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Surgical fixes</text>
    <text x="665" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Element-level precision</text>
  </g>

  <!-- Fix loop circular arrows between Reviewer and Fix Agent -->
  <g data-svgc-id="fix-loop">
    <!-- Top arc: Reviewer → Fix Agent (forward) -->
    <path d="M 420 725 Q 450 705 480 720" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
    <!-- Bottom arc: Fix Agent → Reviewer (return) -->
    <path d="M 480 760 Q 450 780 420 745" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
    <!-- Center label -->
    <text x="450" y="748" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2563EB">Fix ↻ Loop</text>
  </g>

  <!-- Arrow: Reviewer/Fix → Delivery -->
  <line x1="450" y1="795" x2="450" y2="828" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ==================== 6. DELIVERY (Step 6) ==================== -->
  <g data-svgc-id="delivery">
    <rect x="150" y="835" width="600" height="60" rx="8" fill="#059669" filter="url(#shadow-heavy)"/>
    <text x="450" y="862" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Step 6: Deliver — SVG + HTML Preview + Quality Report</text>
    <text x="450" y="882" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#D1FAE5">Output generation → Preview → Delivery</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <text
    data-svgc-id="footer"
    x="450" y="960"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14" fill="#94A3B8"
  >39 files · 4 agents · 4 pipelines · 6 shared services · 0 dependencies</text>

</svg>
