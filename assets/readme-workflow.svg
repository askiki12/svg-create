<path d="M 981 44 L 981 36 L 122 36 L 122 44" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-fb)" data-svgc-id="feedback-loop" data-svgc-type="edge-path"/>
