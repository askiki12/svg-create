<text x="550" y="383" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="white" data-svgc-id="bottom-bar-text">Claude 创意层 → JS Engines 执行层 → validate-svg.js 质量层</text>
