<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 720"
     width="1280" height="720"
     role="img"
     aria-label="Slide Title">
  <title>Slide Title</title>
  <desc>Generated by svg-create. PPT 16:9 template.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-text)"/>
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-primary)"/>
    </marker>

    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadow-lg" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#00000018"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary)"/>
      <stop offset="100%" stop-color="var(--color-secondary)"/>
    </linearGradient>
    <linearGradient id="grad-bg-subtle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-bg)"/>
      <stop offset="100%" stop-color="var(--color-grid)" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <style>
    :root {
      --color-primary: #2563EB;
      --color-secondary: #7C3AED;
      --color-accent: #059669;
      --color-bg: #F8FAFC;
      --color-text: #1E293B;
      --color-text-secondary: #64748B;
      --color-grid: #E2E8F0;
      --font-family: 'Noto Sans SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      --font-size-title: 36px;
      --font-size-subtitle: 24px;
      --font-size-heading: 20px;
      --font-size-body: 16px;
      --font-size-small: 12px;
      --spacing-margin: 40px;
      --spacing-gap: 24px;
      --spacing-section: 48px;
      --shape-radius: 8px;
      --shape-stroke: 2px;
    }

    .slide-bg { fill: var(--color-bg); }
    .node-text { font-family: var(--font-family); font-size: var(--font-size-body); fill: var(--color-text); }
    .node-title { font-family: var(--font-family); font-size: var(--font-size-title); font-weight: bold; fill: var(--color-text); }
    .node-subtitle { font-family: var(--font-family); font-size: var(--font-size-subtitle); fill: var(--color-text-secondary); }
    .node-heading { font-family: var(--font-family); font-size: var(--font-size-heading); font-weight: bold; fill: var(--color-text); }
    .edge-label { font-family: var(--font-family); font-size: 12px; fill: var(--color-text-secondary); }
    .axis-label { font-family: var(--font-family); font-size: 12px; fill: var(--color-text-secondary); }
    .grid-line { stroke: var(--color-grid); stroke-width: 0.5; }
    .chart-mark { transition: opacity 0.2s; }
    .footer-text { font-family: var(--font-family); font-size: 10px; fill: var(--color-text-secondary); opacity: 0.6; }
  </style>

  <!-- Background -->
  <rect width="1280" height="720" class="slide-bg"
        data-svgc-id="bg" data-svgc-type="text-decoration"/>

  <!-- Content is injected here by the pipeline renderer -->

  <!-- Footer -->
  <text x="1240" y="705" text-anchor="end" class="footer-text"
        data-svgc-id="footer" data-svgc-type="text-decoration">svg-create</text>
</svg>
